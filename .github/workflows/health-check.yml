name: Production health check

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *"

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run verify:online

