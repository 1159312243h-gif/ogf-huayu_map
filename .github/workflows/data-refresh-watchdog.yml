name: Catch up overdue data refreshes

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Production health check", "Data freshness audit", "Refresh brand catalog", "Refresh transit and terrain data"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: ogf-atlas-refresh-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify missed-trigger recovery before dispatch
        run: node scripts/test-refresh-watchdog.mjs
      - name: Check the published generation and recover a missed refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ensure-data-refresh.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-watchdog-report
          path: .data-update/refresh-watchdog.json
          if-no-files-found: warn
          retention-days: 14
