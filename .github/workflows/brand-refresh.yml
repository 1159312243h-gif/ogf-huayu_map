name: Refresh brand catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */3 * * *"

permissions:
  contents: write

# Share the data writer lock with national updates. Their three-hour schedule is unchanged.
concurrency:
  group: ogf-atlas-transit-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/test-brands.mjs
      - run: node scripts/update-brand-catalog.mjs
      - run: npm run manifest:update
      - name: Validate the complete site before publishing
        run: |
          npm run verify
          npm run test:data-update
          npm run data:update:check
          npm run check:data
      - name: Commit validated catalog
        id: commit
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Repository changed during refresh; keep the published catalog and retry next run."
            exit 1
          fi
          git add site/brand-catalog.json release/SHA256.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh OGF brand catalog"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ogf-atlas-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_USERNAMES: ${{ vars.HUAYU_ADMIN_USERNAMES }}
    steps:
      - name: Deployment credentials missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Catalog committed, but Cloudflare deployment was skipped; credentials are missing."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 24
      - name: Configure existing personal data bindings
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/configure-cloudflare-personal-data.mjs
      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=ogf-atlas --branch=main --no-bundle --commit-dirty=true
      - name: Verify production
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          VERIFY_ATTEMPTS: "12"
          VERIFY_DELAY_MS: "10000"
        run: npm run verify:online
