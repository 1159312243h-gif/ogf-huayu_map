name: Bootstrap complete project

on:
  push:
    paths:
      - ogf-huayu-map-bootstrap.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified project archive
        run: |
          unzip -o ogf-huayu-map-bootstrap.zip
          rm -f ogf-huayu-map-bootstrap.zip
          rm -f .github/workflows/bootstrap.yml
      - name: Commit complete project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete OGF Huayu Map maintenance project"
          git push
