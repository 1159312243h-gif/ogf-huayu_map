name: Data freshness audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 19 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:data
      - run: npm run probe:live
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-freshness-report
          path: data-freshness-report.json
          if-no-files-found: error
          retention-days: 14
