name: Refresh transit and terrain data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/data-refresh.yml
      - scripts/update-all-data.mjs
      - scripts/test-data-updater.mjs
      - scripts/data-update/builders/**
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: ogf-atlas-transit-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover verified repair files uploaded to the repository root
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile, mkdir } from "node:fs/promises";
          import path from "node:path";

          // One-time recovery for upload c8ecdb6. Only replace the exact old
          // versions; preserve subsequent edits and keep all uploaded originals.
          const repairs = [
            ["docs/MAP_RULES_ZH.md", "4ad10bd54e921bbf38712855be4d2efe525e05dad6744266124b0c8564693ed7", "be7015809c4f395158c45f6d10fa9c31f680f0df0eaca8e0df5a93d4fc06de33"],
            ["scripts/test-transit-display.mjs", "07d249e0a5f7242abd8f644f116c882ea260770c0b260d7160640fb1ee6e4c5e", "10c02b36941df7bdd7bed00e4ad3b52bf477dd2bb594eedac7d872fda3def703"],
            ["scripts/update-all-data.mjs", "9a146d9a1f8adbcadd2bc42caec03883a2bcfa956c910bd58b6acda16c5b1738", "197ab35ddea087d49d1d2f28df37e9d07d22911eb91eae997c6d29f38a49c15b"],
            ["scripts/data-update/builders/build-terrain-context.cjs", "dcc3161291cf894f21005f9d8684baea0560a92272086caecf1d3d07ec01fe03", "804d37573a6f68478edecfe60b28c448d7a73285ce6e83f456f1dd7f712a9e1d"],
            ["scripts/test-terrain-context.mjs", "9a5e4f167faab7dbbf78028805b677b9eeec6fa7578c9186ef41286a7e65347a", "8dbc9627b995989369f2b08a5d517adfee764f8e16101a3d177d309825cf5b79"],
            ["site/app.js", "d24e120008f135820d5e2cc445de78e41f0f0f64f0112807d1bdb973eb5e9b45", "b392371cff6deab0b9287061ac11f6be8ca47bcf0621b820be7e15322163ffaf"],
          ];
          const digest = (body) => createHash("sha256").update(body).digest("hex");
          const pending = [];
          for (const [destination, oldHash, repairHash] of repairs) {
            const current = await readFile(destination);
            if (digest(current) !== oldHash) {
              console.log(`Preserving repaired or subsequently edited file: ${destination}`);
              continue;
            }
            const source = path.basename(destination);
            const body = await readFile(source);
            if (digest(body) !== repairHash) {
              throw new Error(`Repair file integrity check failed: ${source}; no recovery files were written`);
            }
            pending.push({ source, destination, body });
          }
          // Validate every required source before modifying any destination.
          for (const { source, destination, body } of pending) {
            await mkdir(path.dirname(destination), { recursive: true });
            await writeFile(destination, body);
            console.log(`Recovered ${source} -> ${destination}`);
          }
          console.log(`Verified upload recovery complete: ${pending.length} files restored`);
          NODE
          npm run manifest:update
      - name: Run updater regression checks
        run: |
          npm run verify
          npm run test:data-update
          npm run data:update:check
      - name: Rebuild and validate all generated data
        run: npm run data:update
      - name: Validate refreshed data
        run: |
          npm run test:data-update
          npm run data:update:check
          npm run check:data
          npm run test:terrain-preload
      - name: Commit verified repairs and changed data
        id: commit
        shell: bash
        run: |
          git add -- \
            docs/MAP_RULES_ZH.md \
            scripts/test-transit-display.mjs \
            scripts/update-all-data.mjs \
            scripts/data-update/builders/build-terrain-context.cjs \
            scripts/test-terrain-context.mjs \
            site/app.js \
            site/transit-preload.json \
            site/transit-relations.json \
            site/railway-routing.json \
            site/railway-connections.json \
            site/station-access.json \
            site/airports.json \
            site/terrain-preload.json.gz \
            site/terrain-preload-manifest.json \
            site/terrain-preload-chunks \
            site/terrain-render-cache \
            release/SHA256.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh generated OGF data"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload update diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-data-refresh-${{ github.run_id }}
          path: |
            .data-update/latest-report.json
            .data-update/runs/*/report.json
            .data-update/runs/*/logs/*.log
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare credentials are not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Data was committed, but Cloudflare deployment was skipped because production credentials are missing."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          ref: ${{ needs.refresh.outputs.commit }}
      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=ogf-atlas --branch=main --no-bundle --commit-dirty=true
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 24
      - name: Verify production
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          VERIFY_ATTEMPTS: "12"
          VERIFY_DELAY_MS: "10000"
        run: npm run verify:online
